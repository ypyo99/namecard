<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI 일자리 명함 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Brush+Script&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 입력 폼(왼쪽) + 큰 미리보기(오른쪽). 휴대폰에서는 미리보기가 위로 */
:root{
  --bg:#f3f6fb; --panel:#ffffff; --fg:#17233a; --muted:#5a6780; --line:#d8e0ec;
  --accent:#1f5fc4; --accent-ink:#ffffff; --soft:#e6eefb; --ok:#1d8a52; --warn:#b4570d;
  --title-color:#3b82f6;
  --ui:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --brush:"Nanum Brush Script","Noto Sans KR",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1522; --panel:#172033; --fg:#e7ecf5; --muted:#9aa7bf; --line:#2a364d;
  --accent:#6aa3ff; --accent-ink:#0b1426; --soft:#1d2a44; --ok:#5fd394; --warn:#f0a35b; --title-color:var(--accent); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1522; --panel:#172033; --fg:#e7ecf5; --muted:#9aa7bf; --line:#2a364d;
  --accent:#6aa3ff; --accent-ink:#0b1426; --soft:#1d2a44; --ok:#5fd394; --warn:#f0a35b; --title-color:var(--accent); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:17px;line-height:1.55;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:20px}
header h1{font-size:28px;margin:0;letter-spacing:-.01em;text-wrap:balance}
header h1 span{font-family:var(--brush);font-weight:400;font-size:40px;color:var(--title-color);margin-right:6px}
header p{margin:4px 0 0;color:var(--muted);line-height:1.7}
#saveText b{background:var(--accent);color:var(--accent-ink);padding:4px 10px;border-radius:6px;font-weight:700;display:inline-block;margin:0 2px;letter-spacing:-0.5px}
.grid{display:grid;grid-template-columns:440px minmax(0,1fr);gap:20px;align-items:start}
.form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:22px;min-width:0}
fieldset{border:0;margin:0;padding:0;display:grid;gap:12px;min-width:0}
legend{font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--accent-ink);background:var(--accent);padding:6px 16px;border-radius:8px;margin-bottom:14px;box-shadow:0 3px 8px rgba(0,0,0,.15);justify-self:start}
label{display:grid;gap:4px;font-weight:500;font-size:16px}
.inline-label{grid-template-columns:72px 1fr;align-items:center;gap:12px}
label small{font-weight:400;color:var(--muted);font-size:14px}
input[type=text],textarea{font:inherit;font-size:18px;color:#0a3a8c;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-weight:600}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus-visible,textarea:focus-visible,button:focus-visible,.file:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.legend-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.legend-actions{display:flex;gap:6px}
.file{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:18px;cursor:pointer;font-weight:700;color:var(--accent);background:var(--soft);text-align:center}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.sliders{display:grid;gap:8px}
.sliders label{grid-template-columns:64px 1fr;align-items:center;font-size:15px}
input[type=range]{width:100%;accent-color:var(--accent)}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.themes button{font:inherit;font-size:15px;border:2px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:8px 14px 8px 10px;display:flex;align-items:center;gap:8px;cursor:pointer}
.themes button[aria-pressed=true]{border-color:var(--accent);font-weight:700}
.themes i{width:20px;height:20px;border-radius:50%;display:block}
.btn{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:var(--soft);color:var(--accent);font-size:16px;padding:10px 14px}
.btn:disabled{opacity:.55;cursor:wait}
.note{font-size:14px;color:var(--muted);margin:0}
.status{font-size:15px;margin:0;min-height:1.4em}
.status:empty{display:none}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:14px;min-width:0}
.cardbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.cardbox img{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 6px 24px rgba(10,30,70,.18)}
.actions{display:grid;grid-template-columns:1fr;gap:8px}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .preview{position:static;order:-1}
}
@media (max-width:420px){
  .row2{grid-template-columns:1fr}
  #photoRow.row2{grid-template-columns:1fr 1fr; gap:8px}
  #photoRow.row2 .file{font-size:14px !important; padding:12px 4px !important; letter-spacing:-0.3px}
}
.sheet[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(8,14,28,.82);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet-in{background:var(--panel);color:var(--fg);border-radius:16px;padding:18px;width:min(560px,100%);max-height:100%;overflow:auto;display:grid;gap:14px}
.sheet-in h2{margin:0;font-size:21px}
.sheet-in img{width:100%;height:auto;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.25);-webkit-touch-callout:default;user-select:auto}
.steps{margin:0;padding-left:22px;display:grid;gap:6px;font-size:17px}
.steps b{color:var(--accent)}
</style>

<div class="wrap">
  <header>
    <h1><span>움직이는 힘으로 결과를 만듭니다</span><br>명함 만들기</h1>
    <p>사진을 올리고 내용을 고치면 명함이 바로 바뀝니다. <span id="saveText">다 되면 <b>JPG로 저장하기</b>를 눌러 주세요.</span></p>
  </header>

  <div class="grid">
    <form class="form" id="f" autocomplete="off">
      <fieldset>
        <div class="legend-row">
          <legend style="margin:0">1. 얼굴 사진</legend>
          <div class="legend-actions" id="photoRow">
            <label class="file" id="fileLabel" style="font-size:14px;padding:8px 12px;font-weight:800">🖼️ 갤러리에서 선택
              <input type="file" id="photo" accept="image/*">
            </label>
            <label class="file" id="cameraLabel" style="font-size:14px;padding:8px 12px;font-weight:800">📸 카메라로 찍기
              <input type="file" id="photoCam" accept="image/*" capture="user">
            </label>
          </div>
        </div>
        <div class="sliders">
          <label><b>크기</b> <input type="range" id="zoom" min="40" max="250" value="100"></label>
          <label><b>좌우</b> <input type="range" id="ox" min="-100" max="100" value="0"></label>
          <label><b>위아래</b> <input type="range" id="oy" min="-100" max="100" value="0"></label>
        </div>
      </fieldset>

      <fieldset>
        <div class="legend-row">
          <legend style="margin:0">2. 기본 정보</legend>
          <div class="legend-actions">
            <button type="button" class="btn ghost" id="infoFontMinus" style="width:32px;padding:4px 0;text-align:center;font-size:16px">-</button>
            <span style="font-size:14px;font-weight:700;min-width:38px;text-align:center;align-self:center" id="infoFontLabel">80%</span>
            <button type="button" class="btn ghost" id="infoFontPlus" style="width:32px;padding:4px 0;text-align:center;font-size:16px">+</button>
          </div>
        </div>
        <label class="inline-label"><b>이름</b> <input type="text" id="name" value="홍길동"></label>
        <label class="inline-label"><b>전화번호</b> <input type="text" id="phone" value="010-1234-5678"></label>
        <label class="inline-label"><b>이메일</b> <input type="text" id="email" value="gildong.hong@gmail.com"></label>
      </fieldset>

      <fieldset>
        <legend>3. 명함 내용</legend>
        <label><b>큰 제목</b> <input type="text" id="headline" value="움직이는 힘으로 결과를 만듭니다"></label>
        <label><b>경력 (한 줄에 하나씩)</b><textarea id="career" rows="2">은행 근무 25년</textarea></label>
        <label><b>강점 (한 줄에 하나씩, 3개 정도)</b><textarea id="skills" rows="3">행동력.실행력.부지런함
사람들과 소통하기
고객 응대하기</textarea></label>
        <label><b>희망하는 업무</b> <small>한 줄에 하나씩 적으면 내용에 맞는 아이콘이 자동으로 들어가요.</small><textarea id="ai" rows="4">시설관리
환경정비.물품관리
배송.운반
안전지킴이</textarea></label>
        <button type="button" class="btn ghost" id="aiBtn" hidden>✨ 경력과 강점으로 AI에게 희망 업무 추천받기</button>
        <p class="status" id="aiStatus" aria-live="polite"></p>
      </fieldset>

      <fieldset>
        <legend>4. 색상</legend>
        <div class="themes" id="themes"></div>
      </fieldset>
    </form>

    <section class="preview" aria-label="명함 미리보기">
      <div class="cardbox"><img id="out" alt="명함 미리보기"></div>
      <div class="actions">
        <button type="button" class="btn" id="save">⬇ JPG로 저장하기</button>
        <button type="button" class="btn" id="saveA4" style="margin-top:2px; background: #28a745; color: white; border: none;">🖨️ A4 프린트용 모아 찍기 (10장)</button>
        <p class="status" id="saveStatus" aria-live="polite"></p>
      </div>
    </section>
  </div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-in">
    <h2 id="sheetTitle">갤러리에 저장하기</h2>
    <img id="sheetImg" alt="저장할 명함 이미지">
    <ol class="steps" id="sheetSteps"></ol>
    <button type="button" class="btn ghost" id="sheetFile" hidden>파일로 저장하기</button>
    <p class="status" id="sheetStatus" aria-live="polite"></p>
    <button type="button" class="btn" id="sheetClose">닫기</button>
  </div>
</div>
<canvas id="cv" width="2380" height="1376" hidden></canvas>

<script>
const $=id=>document.getElementById(id);
const W=1190,H=688,S=2;
const cv=$('cv'),ctx=cv.getContext('2d');
const SANS='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const BRUSH='"Nanum Brush Script","Noto Sans KR",cursive';

const UA=navigator.userAgent||'';
const IS_IOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const IS_ANDROID=/Android/.test(UA);
const IS_MOBILE=IS_IOS||IS_ANDROID||(matchMedia('(pointer:coarse)').matches&&innerWidth<900);

if(!IS_MOBILE) {
  $('cameraLabel').hidden = true;
  $('photoRow').classList.remove('row2');
  $('fileLabel').firstChild.textContent = '📷 사진 선택하기 ';
}

const THEMES={
  blue:{label:'파랑',dark:'#0a3a8c',main:'#2167cf',hi:'#5f9ff0',ink:'#0c2c66',p2:'#1f9a5c',p2d:'#147445',pill3:'#d9e7fb',chip:'#1f5fc4',bg1:'#e9f1fb',wave:'#c7dcf5',wave2:'#d5ecdf'},
  green:{label:'초록',dark:'#0d5a42',main:'#1d9670',hi:'#5fcca6',ink:'#0c3f30',p2:'#2a6fd0',p2d:'#1c55a8',pill3:'#d6f0e5',chip:'#16805f',bg1:'#e8f6f0',wave:'#c3e8d9',wave2:'#d9e6f8'},
  plum:{label:'자주',dark:'#5a1d4e',main:'#94387f',hi:'#d47ec0',ink:'#43153a',p2:'#c26a16',p2d:'#9a520e',pill3:'#f4e0ef',chip:'#86306f',bg1:'#f7edf4',wave:'#ebcfe3',wave2:'#f6e4cf'},
  orange:{label:'주황',dark:'#c2410c',main:'#ea580c',hi:'#fb923c',ink:'#431407',p2:'#2167cf',p2d:'#0a3a8c',pill3:'#ffedd5',chip:'#c2410c',bg1:'#fff7ed',wave:'#fed7aa',wave2:'#ffedd5'},
};
const DOTS=['#f08a24','#8a6cf0','#14a0a0','#e2557a','#3f86e8'];
let theme='blue', photo=null, photoBg='#eef2f7', infoFontSize=80;
function edgeColor(im){try{const c=document.createElement('canvas');c.width=c.height=40;const g=c.getContext('2d');g.drawImage(im,0,0,40,40);const d=g.getImageData(0,0,40,40).data;let r=0,gg=0,b=0,n=0;for(let y=0;y<40;y++)for(let x=0;x<40;x++){if(y>4&&(y>22||(x>2&&x<37)))continue;const i=(y*40+x)*4;r+=d[i];gg+=d[i+1];b+=d[i+2];n++;}return `rgb(${r/n|0},${gg/n|0},${b/n|0})`;}catch(e){return '#eef2f7';}}

// theme buttons
const tbox=$('themes');
for(const [k,t] of Object.entries(THEMES)){
  const b=document.createElement('button');b.type='button';b.id='theme-'+k;
  b.innerHTML=`<i style="background:linear-gradient(135deg,${t.dark},${t.main})"></i>${t.label}`;
  b.setAttribute('aria-pressed',k===theme);
  b.onclick=()=>{theme=k;tbox.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));schedule();};
  tbox.appendChild(b);
}

$('infoFontMinus').onclick=()=>{if(infoFontSize>50){infoFontSize-=10;$('infoFontLabel').textContent=infoFontSize+'%';schedule();}};
$('infoFontPlus').onclick=()=>{if(infoFontSize<200){infoFontSize+=10;$('infoFontLabel').textContent=infoFontSize+'%';schedule();}};

const handlePhoto = e=>{
  const f=e.target.files[0]; if(!f) return;
  const url=URL.createObjectURL(f); const im=new Image();
  im.onload=()=>{
    photo=im;$('zoom').value=100;$('ox').value=0;$('oy').value=0;photoBg=edgeColor(im);
    try {
      const c = document.createElement('canvas');
      let w = photo.width, h = photo.height;
      if (w > 1000 || h > 1000) {
        const r = 1000 / Math.max(w, h);
        w *= r; h *= r;
      }
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(photo, 0, 0, w, h);
      photo.b64 = c.toDataURL('image/jpeg', 0.85);
    } catch(err) {}
    if(IS_MOBILE) {
      $('fileLabel').firstChild.textContent='🖼️ 다른 사진 선택 ';
      $('cameraLabel').firstChild.textContent='📸 다시 찍기 ';
    } else {
      $('fileLabel').firstChild.textContent='📷 다른 사진으로 바꾸기 ';
    }
    schedule();
  };
  im.src=url;
};
$('photo').addEventListener('change',handlePhoto);
$('photoCam').addEventListener('change',handlePhoto);
$('f').addEventListener('input',schedule);

const lines=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
const val=id=>$(id).value.trim();

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fitFont(text,weight,size,family,maxW,min=12){
  let s=size; ctx.font=`${weight} ${s}px ${family}`;
  while(s>min && ctx.measureText(text).width>maxW){s-=1;ctx.font=`${weight} ${s}px ${family}`;}
  return s;
}

/* ---------- small vector icons ---------- */
function iconBank(cx,cy,c){ctx.save();ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(cx-13,cy-5);ctx.lineTo(cx,cy-13);ctx.lineTo(cx+13,cy-5);ctx.closePath();ctx.fill();
  for(let i=-1;i<=1;i++)ctx.fillRect(cx+i*8-2,cy-3,4,12);ctx.fillRect(cx-14,cy+10,28,3);ctx.restore();}
function iconBulb(cx,cy,c){ctx.save();ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=2.4;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(cx,cy-3,7.5,0,Math.PI*2);ctx.stroke();ctx.fillRect(cx-4,cy+6,8,3);ctx.fillRect(cx-3,cy+10.5,6,2);
  for(let a=0;a<5;a++){const an=Math.PI*(1+a/4);ctx.beginPath();ctx.moveTo(cx+Math.cos(an)*11,cy-3+Math.sin(an)*11);ctx.lineTo(cx+Math.cos(an)*15,cy-3+Math.sin(an)*15);ctx.stroke();}ctx.restore();}
function iconStar(cx,cy,c){ctx.save();ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<5;i++){const a=Math.PI*2*i/5-Math.PI/2;ctx.lineTo(cx+Math.cos(a)*11.5,cy+Math.sin(a)*11.5);const b=Math.PI*2*(i+0.5)/5-Math.PI/2;ctx.lineTo(cx+Math.cos(b)*4.4,cy+Math.sin(b)*4.4);}ctx.closePath();ctx.fill();ctx.restore();}
function iconChip(cx,cy,c){ctx.save();ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=2;rr(cx-10,cy-10,20,20,3);ctx.stroke();
  for(let i=-1;i<=1;i++){const d=i*6;[[cx+d,cy-10,cx+d,cy-14],[cx+d,cy+10,cx+d,cy+14],[cx-10,cy+d,cx-14,cy+d],[cx+10,cy+d,cx+14,cy+d]].forEach(([a,b,e,f])=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(e,f);ctx.stroke();});}
  ctx.font=`800 10px ${SANS}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('AI',cx,cy+.5);ctx.restore();}
function iconPhone(x,y){ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=2;rr(x-6,y-10,12,20,3);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(x-2,y+5,4,2);ctx.restore();}
function iconMail(x,y){ctx.save();ctx.fillStyle='#fff';rr(x-10,y-7,20,14,2);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x-9,y-6);ctx.lineTo(x,y+1);ctx.lineTo(x+9,y-6);ctx.stroke();ctx.restore();}
function iconPin(x,y,bg){ctx.save();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y-3,7.5,Math.PI*0.85,Math.PI*2.15);ctx.lineTo(x,y+10);ctx.closePath();ctx.fill();ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x,y-3,3,0,Math.PI*2);ctx.fill();ctx.restore();}
function check(x,y,c){ctx.save();ctx.strokeStyle=c;ctx.lineWidth=3.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x-8,y);ctx.lineTo(x-2,y+6);ctx.lineTo(x+9,y-7);ctx.stroke();ctx.restore();}

/* ---------- photo ---------- */
let featherCache={key:'',cv:null};
function feathered(dw,dh,L,R,Tp,B){
  const w=Math.max(1,Math.round(dw*S)),h=Math.max(1,Math.round(dh*S));
  const key=[w,h,L,R,Tp,B,photo.src].join('|');
  if(featherCache.key===key)return featherCache.cv;
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.drawImage(photo,0,0,w,h);
  const f=Math.round(Math.min(w,h)*0.14);
  const mask=document.createElement('canvas');mask.width=w;mask.height=h;const m=mask.getContext('2d');
  m.fillStyle='#000';m.fillRect(0,0,w,h);m.globalCompositeOperation='destination-in';
  // each edge multiplies alpha: draw full-size gradient that is opaque beyond the feather band
  const band=(on,dir)=>{if(!on)return;const gr=dir==='L'?m.createLinearGradient(0,0,f,0):dir==='R'?m.createLinearGradient(w,0,w-f,0):dir==='T'?m.createLinearGradient(0,0,0,f):m.createLinearGradient(0,h,0,h-f);

function drawPhoto(T){

const iconCache={};           // AI가 찾아 준 아이콘
const iconPending=new Set();
function autoIcon(t){
  if(iconCache[t])return iconCache[t];
  for(const [re,e] of ICON_RULES) if(re.test(t)) return e;
  return null;
}
let iconTimer=null;
function queueAiIcons(list){
  const todo=list.filter(t=>!iconCache[t]&&!iconPending.has(t));
  if(!todo.length||!sample)return;
  clearTimeout(iconTimer);
  iconTimer=setTimeout(async()=>{
    try{
      const perm=await window.claude.use('permissions');
      const st=perm?await perm.state('sample'):'unavailable';
      if(st!=='granted')return;           // 허락 전에는 AI를 부르지 않고 기본 아이콘 사용
      todo.forEach(t=>iconPending.add(t));
      const r=await sample.json(`아래 각 활동에 가장 잘 어울리는 그림문자(이모지) 1개씩을 골라 주세요. 명함 아이콘으로 쓰입니다. 흔한 표준 이모지만 쓰세요.
${todo.map(t=>'- '+t).join('\n')}
JSON으로만 답하세요: {"icons":{"활동 그대로":"이모지"}}`,{modelTier:'quick'});
      const m=(r&&r.icons)||{};
      todo.forEach(t=>{const e=m[t]&&String(m[t]).trim();if(e&&e.length<=8)iconCache[t]=e;iconPending.delete(t);});
      schedule();

/* ---------- save state ---------- */
function saveState() {
  const state = {
    name: $('name').value, phone: $('phone').value, email: $('email').value,
    headline: $('headline').value, career: $('career').value, skills: $('skills').value, ai: $('ai').value,
    zoom: $('zoom').value, ox: $('ox').value, oy: $('oy').value,
    theme: theme, photoBg: photoBg, infoFontSize: infoFontSize
  };
  if (photo && photo.b64) {
    state.photoSrc = photo.b64;
  } else if (photo && photo.src && photo.src.startsWith('data:')) {
    state.photoSrc = photo.src;
  } else {
    try {
        const existing = JSON.parse(localStorage.getItem('cardState') || '{}');
        if (existing.photoSrc) state.photoSrc = existing.photoSrc;
    } catch(e) {}
  }
  try { localStorage.setItem('cardState', JSON.stringify(state)); } catch(e) {}
}

function loadState() {
  try {
    const saved = localStorage.getItem('cardState');
    if (!saved) return false;
    const state = JSON.parse(saved);
    if (state.name !== undefined) $('name').value = state.name;
    if (state.phone !== undefined) $('phone').value = state.phone;
    if (state.email !== undefined) $('email').value = state.email;
    if (state.headline !== undefined) $('headline').value = state.headline;
    if (state.career !== undefined) $('career').value = state.career;
    if (state.skills !== undefined) $('skills').value = state.skills;
    if (state.ai !== undefined) $('ai').value = state.ai;
    if (state.zoom !== undefined) $('zoom').value = state.zoom;
    if (state.ox !== undefined) $('ox').value = state.ox;
    if (state.oy !== undefined) $('oy').value = state.oy;
    if (state.theme && THEMES[state.theme]) {
      theme = state.theme;
      tbox.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.id === 'theme-'+theme));
    }
    if (state.infoFontSize !== undefined) {
      infoFontSize = state.infoFontSize;
      $('infoFontLabel').textContent = infoFontSize + '%';
    }
    if (state.photoBg) photoBg = state.photoBg;
    if (state.photoSrc) {
      const im = new Image();
      im.onload = () => {
        if (photo && photo !== defaultImg) return;
        photo = im; photo.b64 = state.photoSrc;
        if(IS_MOBILE) {
          $('fileLabel').firstChild.textContent='🖼️ 다른 사진 선택 ';
          $('cameraLabel').firstChild.textContent='📸 다시 찍기 ';
        } else {
          $('fileLabel').firstChild.textContent='📷 다른 사진으로 바꾸기 ';
        }
        schedule();
      };
      im.src = state.photoSrc;
      return true;
    }
  } catch(e) {}
  return false;
}

async function saveFile(st){
  st.className='status';
  const blob=await cardBlob();
  if(!downloads){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    st.classList.add('ok');
    st.textContent = '저장했어요: ' + fileName();
    return;
  }
  try{
    await downloads.save({filename:fileName(),data:blob});
    st.classList.add('ok');
    st.textContent=IS_ANDROID?'저장했어요. 갤러리 앱의 "다운로드" 앨범에서 볼 수 있어요.':IS_IOS?'저장했어요. 공유 창에서 "이미지 저장"을 골랐다면 사진 앱에 들어 있어요.':'저장했어요: '+fileName();
  }catch(e){
    if(e&&e.code==='declined'){st.textContent='저장을 취소했어요.';}

$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet();});
$('sheetFile').onclick=()=>saveFile($('sheetStatus'));

$('save').onclick=()=>{ if(IS_MOBILE) openSheet(); else saveFile($('saveStatus')); };

async function saveA4File(st){
  st.className='status';
  st.textContent='A4 용지를 만들고 있어요...';
  await render();
  const a4W = 2480, a4H = 3508;
  const ac = document.createElement('canvas');
  ac.width = a4W; ac.height = a4H;
  const ax = ac.getContext('2d');
  ax.fillStyle = '#ffffff';
  ax.fillRect(0, 0, a4W, a4H);
  
  // 300dpi 기준으로 9.1cm = 1075px, 5cm = 591px
  const cardW = 1075, cardH = 591;
  const cols = 2, rows = 5;
  const startX = Math.round((a4W - cardW * cols) / 2);
  const startY = Math.round((a4H - cardH * rows) / 2);
  
  // 1. 이미지 먼저 배치
  for(let r=0; r<rows; r++){
    for(let c=0; c<cols; c++){
      const dx = startX + c * cardW;
      const dy = startY + r * cardH;
      ax.drawImage(cv, dx, dy, cardW, cardH);
    }
  }
  
  // 2. 가위선(절취선) 명확하게 그리기
  ax.strokeStyle = '#999999';
  ax.lineWidth = 1;
  ax.setLineDash([]);
  ax.beginPath();
  // 가로선
  for(let r=0; r<=rows; r++){
    ax.moveTo(startX - 30, startY + r * cardH);
    ax.lineTo(startX + cols * cardW + 30, startY + r * cardH);
  }
  // 세로선
  for(let c=0; c<=cols; c++){
    ax.moveTo(startX + c * cardW, startY - 30);
    ax.lineTo(startX + c * cardW, startY + rows * cardH + 30);
  }
  ax.stroke();
  
  // 가위 아이콘 안내
  ax.font = '50px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ax.textAlign = 'center';
  ax.textBaseline = 'middle';
  ax.fillText('✂️', startX + cardW, startY - 60);
  ax.fillText('✂️', startX - 60, startY + cardH);
  
  const blob = await new Promise(r => ac.toBlob(r, 'image/jpeg', 0.95));
  const fn = fileName().replace('.jpg', '-A4프린트.jpg');
  
  if(!downloads){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fn;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    st.classList.add('ok');
    st.textContent = 'A4 프린트용 이미지를 저장했어요.';
    return;
  }
  try{
    await downloads.save({filename:fn, data:blob});
    st.classList.add('ok');
    st.textContent = 'A4 프린트용 이미지를 저장했어요.';
  }catch(e){
    st.classList.add('warn');
    st.textContent = 'A4 이미지 저장에 실패했어요.';
  }
}
$('saveA4').onclick = () => saveA4File($('saveStatus'));
if(IS_MOBILE) {
  $('save').textContent='⬇ 갤러리에 저장하기';
  $('saveText').innerHTML='다 되면 <b>갤러리에 저장하기</b>를 눌러 주세요.';
}

/* ---------- AI recommend ---------- */
let sample=null;
async function aiRecommend(){
  const btn=$('aiBtn'),st=$('aiStatus');
  const career=lines('career').join(', '),skills=lines('skills').join(', ');
  if(!career&&!skills){st.className='status warn';st.textContent='경력이나 강점을 먼저 적어 주세요.';return;}
  btn.disabled=true;st.className='status';st.textContent='AI가 생각하고 있어요… (10~30초)';
  try{
    const r=await sample.json(
`당신은 시니어 일자리 상담사입니다. 아래 어르신의 경력과 강점을 보고, 새로 도전해 볼 만한 일자리·활동 3가지를 추천하세요.
- 각 항목은 14자 이내의 짧은 한국어 명사구, 맨 앞에 내용에 어울리는 그림문자 1개 + 공백 (예: "💼 금융·행정 업무 지원")
- 실제 시니어 일자리로 이어질 수 있는 현실적인 활동
경력: ${career||'(없음)'}
강점: ${skills||'(없음)'}
JSON으로만 답하세요: {"items":["...","...","..."]}`,{modelTier:'quick',cache:false});
    const items=(r&&Array.isArray(r.items)?r.items:[]).map(s=>String(s).trim()).filter(Boolean).slice(0,4);
    if(!items.length)throw {code:'empty'};
    $('ai').value=items.join('\n');schedule();
    st.className='status ok';st.textContent='추천을 넣었어요. 마음에 들지 않으면 직접 고치거나 다시 눌러 보세요.';
  }catch(e){
    st.className='status warn';
    if(e&&e.code==='not_granted'){st.textContent='AI 추천 사용이 허용되지 않았어요. 직접 적어 주셔도 됩니다.';btn.hidden=true;}
    else if(e&&e.code==='rate_limited'){st.textContent='잠시 후 다시 눌러 주세요.';}
    else st.textContent='추천을 받지 못했어요. 잠시 후 다시 시도하거나 직접 적어 주세요.';
  }finally{btn.disabled=false;}
}
$('aiBtn').onclick=aiRecommend;
